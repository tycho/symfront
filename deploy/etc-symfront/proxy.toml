# Caching-proxy settings (translated from symsrv's main.toml).

[cache]
# New cache root — separate from the store AND from the Python cache at
# /srv/cache/ntsymbols/data. Populate once with:
#   symfront proxy import /srv/cache/ntsymbols/data
# (hardlinks when both live on the same dataset; --copy otherwise)
path = "/srv/cache/symfront"

# Same budget the Python config declared (it never enforced it; we do).
# Eviction drops soonest-expiring positive entries at the high watermark.
size = "512GB"
#high_watermark = 1.0
#low_watermark = 0.95

# "lighttpd" matches the current deployment: cache-hit bodies are offloaded
# via X-Sendfile, which lighttpd resolves as an absolute filesystem path —
# so accel_prefix is the cache *data* directory itself (and it must appear
# in lighttpd's x-sendfile-docroot list).
# "nginx" offloads via X-Accel-Redirect instead; accel_prefix is then the
# internal-location URI aliasing the data directory (e.g. the
# /_symfront_cache location in deploy/nginx-symfront.conf.example).
# "standalone" serves bodies ourselves — richer stats (actual wire bytes,
# per-response compression ratios) at the cost of the offload.
mode = "lighttpd"
accel_prefix = "/srv/cache/symfront/data"

# Offload tier-0 (managed store) hits the same way: the header value is
# this prefix plus the store-relative path. For lighttpd point it at the
# store root itself (also listed in x-sendfile-docroot); for nginx at an
# internal location aliasing the store. Unset: symfront streams store hits
# itself even in the accel modes.
accel_store_prefix = "/srv/symstore"

[ttl]
# Positive entries: 365d, sliding on every hit (was fixed 365d in symsrv).
positive = "365d"
# Negative entries: escalating ladder replacing the old flat per-status TTLs
# (404 was 7d, 403 was 14d). Fresh Windows-patch symbols that appear on msdl
# a day late now get re-probed quickly instead of being missing for a week.
negative = ["1h", "1h", "1h", "8h", "8h", "24h", "7d"]

[health]
probe_interval = "30s"
probe_timeout = "15s"

[fanout]
# Priority tiers launch this far apart (first 200 still wins globally).
stagger = "100ms"
connect_timeout = "5s"
read_timeout = "20s"

[debuginfod]
# Sentry probes PE modules through SSQP ELF keys with 13-char pseudo
# build-ids; debuginfod servers 503 those (uncacheable). Don't fan them out.
min_buildid_hex = 32

[dns]
# Keep upstream hostnames resolved (A + AAAA through the system resolver)
# so cold starts never pay for a recursive lookup and flaky resolution
# (debuginfod.elfutils.org) surfaces in the background, not on requests.
prewarm_interval = "60s"

[compression]
# zstd offered first, gzip fallback (zlib-rs backend); never recompresses
# CAB-packed (*_) payloads; floor matches the old nginx gzip_min_length.
min_size = 4096
gzip_level = 6
zstd_level = 3

