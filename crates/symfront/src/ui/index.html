const isAdminUser = () => !me?.auth_enabled || me?.user?.role === 'admin';
let proxyStats = null;
let proxyPollBusy = false;

/* Live refresh: while the Proxy tab is visible, re-fetch stats every 2 s and
   update the cards + upstream table in place (search results and the config
   editor are outside the live region and keep their state). */
setInterval(async () => {
  if (currentTab() !== 'proxy' || document.hidden || proxyPollBusy) return;
  if (!document.getElementById('proxyLive')) return;
  proxyPollBusy = true;
  try {
    const s = await api('api/proxy/stats');
    proxyStats = s;
    if (s.enabled) renderProxyLive(s);
  } catch (e) { /* transient; next tick retries */ }
  finally { proxyPollBusy = false; }
}, 2000);

async function loadProxy() {
  const el = $('#tab-proxy');
  let s;
  try { s = await api('api/proxy/stats'); }
  catch (e) { el.innerHTML = `<div class="banner err">${esc(e.message)}</div>`; return; }
  proxyStats = s;
  if (!s.enabled) {
    el.innerHTML = `<div class="banner info">Proxy tier is not configured — add at least one
      <span class="mono">[[upstream]]</span> to upstreams.toml.</div>
      ${isAdminUser() ? proxyConfigHtml() : ''}`;
    if (isAdminUser()) initProxyConfig();
    return;
  }
  el.innerHTML = `
    <div id="proxyLive"></div>
    ${canMutate() ? `<p style="margin-top:12px">
      <button class="btn" id="proxyEvictBtn">Run eviction</button>
      <button class="btn" id="proxyScrubBtn">Run scrub</button>
      <span class="muted">eviction also runs automatically; scrub weekly</span></p>` : ''}
    <h3 style="margin-top:20px">Cache entries</h3>
    <p><input id="proxySearch" placeholder="search cached URLs…" style="width:340px">
      <button class="btn" id="proxySearchBtn">Search</button>
      ${canMutate() ? `<button class="btn" id="proxyPurgeNegBtn" title="evict negative entries whose URL contains the search text">Forget matching 404s</button>` : ''}</p>
    <div id="proxySearchOut"></div>
    ${isAdminUser() ? proxyConfigHtml() : ''}`;
  renderProxyLive(s);
  $('#proxyEvictBtn')?.addEventListener('click', async () => {
    try { await post('api/proxy/evict'); } catch (e) { alert(e.message); }
  });
  $('#proxyScrubBtn')?.addEventListener('click', async () => {
    try { await post('api/proxy/scrub', {repair: true}); } catch (e) { alert(e.message); }
  });
  const doSearch = async () => {
    const q = $('#proxySearch').value.trim();
    if (!q) return;
    try { renderProxyEntries(await api(`api/proxy/cache/search?q=${encodeURIComponent(q)}`)); }
    catch (e) { $('#proxySearchOut').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  };
  $('#proxySearchBtn').addEventListener('click', doSearch);
  $('#proxySearch').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  $('#proxyPurgeNegBtn')?.addEventListener('click', async () => {
    const q = $('#proxySearch').value.trim();
    if (!q) { alert('enter a URL substring first'); return; }
    if (!confirm(`Evict all negative (non-200) cache entries whose URL contains "${q}"?`)) return;
    try {
      const r = await post('api/proxy/cache/evict', {negative_only: true, url_substring: q});
      alert(`${r.evicted} entries evicted`);
      doSearch();
    } catch (e) { alert(e.message); }
  });
  if (isAdminUser()) initProxyConfig();
}

function renderProxyLive(s) {
  const live = document.getElementById('proxyLive');
  if (!live) return;
  const r = s.requests, b = s.bytes, c = s.cache || {};
  const answered = r.tier0_hits + r.cache_hits + r.fills + r.negative_hits + r.passthroughs + r.misses + r.errors;
  const localAnswers = r.tier0_hits + r.cache_hits + r.negative_hits;
  const hitRate = answered ? (100 * localAnswers / answered) : null;
  const saved = s.estimated_seconds_saved || 0;
  const cfgByName = Object.fromEntries((s.upstream_config || []).map(u => [u.name, u]));
  const upstreamRows = Object.keys(s.health || {}).length
    ? Object.keys(s.health || {}).sort().map(name => {
        const cfg = cfgByName[name] || {};
        const u = (s.upstreams || {})[name] || {};
        const h = (s.health || {})[name] || {};
        const state = !cfg.enabled ? '<span class="pill anomalous">disabled</span>'
          : h.suspended ? `<span class="pill deleted" title="${esc(h.info?.cause || '')}">suspended</span>`
          : '<span class="pill active">healthy</span>';
        const act = canMutate() && cfg.enabled
          ? (h.suspended
             ? `<button class="btn" data-resume="${esc(name)}">resume</button>`
             : `<button class="btn" data-suspend="${esc(name)}">suspend</button>`)
          : '';
        return `<tr><td class="mono">${esc(name)}</td><td>${state}</td>
          <td>${esc(cfg.layout || '')}</td><td class="num">${cfg.priority ?? ''}</td>
          <td class="num">${num(u.fills)}</td><td class="num">${fmt(u.fill_bytes)}</td>
          <td class="num">${num(u.negatives)}</td><td class="num">${num(u.errors)}</td>
          <td class="num">${num(u.transport_failures)}</td>
          <td class="num">${u.throughput_bps ? fmt(u.throughput_bps) + '/s' : '—'}</td>
          <td>${act}</td></tr>`;
      }).join('')
    : '<tr><td colspan="11" class="muted">no upstreams</td></tr>';
  live.innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">Requests</div><div class="v">${num(answered)}</div>
        <div class="sub">${num(r.tier0_hits)} store · ${num(r.cache_hits)} cache · ${num(r.fills)} fills</div></div>
      <div class="card"><div class="k">Answered locally</div><div class="v">${hitRate == null ? '—' : hitRate.toFixed(1) + '%'}</div>
        <div class="sub">${num(r.negative_hits)} negative hits · ${num(r.misses)} misses</div></div>
      <div class="card"><div class="k">Bandwidth saved</div><div class="v">${fmt(b.from_cache)}</div>
        <div class="sub">${fmt(b.fetched)} fetched upstream</div></div>
      <div class="card"><div class="k">Est. time saved</div><div class="v">${saved >= 3600 ? (saved/3600).toFixed(1) + ' h' : saved >= 60 ? (saved/60).toFixed(1) + ' m' : saved.toFixed(0) + ' s'}</div>
        <div class="sub">at observed fill speeds</div></div>
      <div class="card"><div class="k">Cache</div><div class="v">${fmt(c.positive_bytes)}</div>
        <div class="sub">${c.size_limit ? (100 * c.positive_bytes / c.size_limit).toFixed(1) + '% of ' + fmt(c.size_limit) : 'no size budget'} · ${num(c.negative_entries)} negatives</div></div>
    </div>
    <h3 style="margin-top:20px">Upstreams <span class="muted" style="font-size:12px;font-weight:normal">(live · counters since server start)</span></h3>
    <table><thead><tr><th>name</th><th>state</th><th>layout</th><th class="num">tier</th>
      <th class="num">fills</th><th class="num">filled</th>
      <th class="num" title="complete 4xx responses (negative-cached)">negatives</th>
      <th class="num" title="complete HTTP 5xx responses passed through to the client; never cached, never trips the breaker">5xx</th>
      <th class="num" title="connection/DNS/timeout failures — no complete HTTP response; these suspend the upstream until a probe restores it">transport</th>
      <th class="num">throughput</th><th></th></tr></thead>
      <tbody>${upstreamRows}</tbody></table>`;
  live.querySelectorAll('[data-suspend]').forEach(btn =>
    btn.addEventListener('click', async () => {
      try { await post(`api/proxy/upstreams/${encodeURIComponent(btn.dataset.suspend)}/suspend`); }
      catch (e) { alert(e.message); }
    }));
  live.querySelectorAll('[data-resume]').forEach(btn =>
    btn.addEventListener('click', async () => {
      try { await post(`api/proxy/upstreams/${encodeURIComponent(btn.dataset.resume)}/resume`); }
      catch (e) { alert(e.message); }
    }));
}

function renderProxyEntries(d) {
  const rows = (d.entries || []).map(e => `<tr>
    <td class="mono" style="max-width:420px;overflow:hidden;text-overflow:ellipsis" title="${esc(e.url)}">${esc(e.url)}</td>
    <td>${esc(e.upstream)}</td>
    <td class="num">${e.status}${e.status !== 200 && e.negative_step ? ` <span class="muted">(step ${e.negative_step})</span>` : ''}</td>
    <td class="num">${e.status === 200 ? fmt(e.size) : '—'}</td>
    <td class="num">${num(e.hit_count)}</td>
    <td class="num" title="expires">${new Date(e.expires_at * 1000).toLocaleDateString()}</td>
    <td>${canMutate() ? `<button class="btn" data-evict-key="${e.key}">evict</button>` : ''}</td></tr>`).join('');
  $('#proxySearchOut').innerHTML = rows
    ? `<table><thead><tr><th>url</th><th>upstream</th><th class="num">status</th>
       <th class="num">size</th><th class="num">hits</th><th class="num">expires</th><th></th></tr></thead>
       <tbody>${rows}</tbody></table>`
    : '<p class="muted">no matching entries</p>';
  document.querySelectorAll('#proxySearchOut [data-evict-key]').forEach(btn =>
    btn.addEventListener('click', async () => {
      try { await api(`api/proxy/cache/entry/${btn.dataset.evictKey}`, {method: 'DELETE'}); btn.closest('tr').remove(); }
      catch (e) { alert(e.message); }
    }));
}

/* ---------- config editor (admin role) ---------- */
function proxyConfigHtml() {
  return `<h3 style="margin-top:24px">Configuration</h3>
  <p class="muted">Edits commit to the config history and reload the proxy immediately.
    Manual on-disk edits are auto-committed before any save, so nothing is ever silently lost.</p>
  <p>
    <select id="cfgFile"></select>
    <button class="btn" id="cfgLoadBtn">Load</button>
    <button class="btn" id="cfgSaveBtn">Save &amp; reload</button>
    <button class="btn" id="cfgReloadBtn" title="re-read the tree from disk (same as SIGHUP)">Reload config</button>
  </p>
  <textarea id="cfgText" spellcheck="false" style="width:100%;height:300px;font-family:ui-monospace,monospace;
    font-size:13px;background:var(--bg2,#161b22);color:var(--text);border:1px solid var(--line,#30363d);
    border-radius:6px;padding:10px;box-sizing:border-box" hidden></textarea>
  <div id="cfgOut"></div>
  <h3 style="margin-top:20px">Config history</h3>
  <div id="cfgLog"></div>
  <div id="cfgDiff"></div>`;
}

async function initProxyConfig() {
  let files;
  try { files = (await api('api/admin/config/files')).files; }
  catch (e) { $('#cfgLog').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; return; }
  $('#cfgFile').innerHTML = files.map(f =>
    `<option value="${esc(f.name)}">${esc(f.name)}${f.exists ? '' : ' (missing)'}</option>`).join('');
  const loadFile = async () => {
    try {
      const d = await api(`api/admin/config/file/${encodeURIComponent($('#cfgFile').value)}`);
      $('#cfgText').hidden = false;
      $('#cfgText').value = d.content;
      $('#cfgOut').innerHTML = '';
    } catch (e) { $('#cfgOut').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  };
  $('#cfgLoadBtn').addEventListener('click', loadFile);
  $('#cfgFile').addEventListener('change', loadFile);
  $('#cfgSaveBtn').addEventListener('click', async () => {
    if ($('#cfgText').hidden) { alert('load a file first'); return; }
    try {
      const r = await post(`api/admin/config/file/${encodeURIComponent($('#cfgFile').value)}`,
                           {content: $('#cfgText').value});
      $('#cfgOut').innerHTML = `<div class="banner ok">Saved as ${esc(r.commit.slice(0,10))} — ${esc(r.summary)}</div>`;
      refreshCfgLog();
    } catch (e) { $('#cfgOut').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  });
  $('#cfgReloadBtn').addEventListener('click', async () => {
    try {
      const r = await post('api/admin/config/reload');
      $('#cfgOut').innerHTML = `<div class="banner ok">${esc(r.summary)}</div>`;
      refreshCfgLog();
    } catch (e) { $('#cfgOut').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  });
  refreshCfgLog();
}

async function refreshCfgLog() {
  let d;
  try { d = await api('api/admin/config/log?limit=15'); }
  catch (e) { $('#cfgLog').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; return; }
  $('#cfgLog').innerHTML = `
    ${d.dirty ? '<div class="banner info">Uncommitted manual edits on disk (auto-committed on next save/reload).</div>' : ''}
    <table><thead><tr><th>commit</th><th>when</th><th>author</th><th>message</th><th></th></tr></thead>
    <tbody>${(d.entries || []).map((e, i) => `<tr>
      <td class="mono">${esc(e.short_id)}</td>
      <td>${new Date(e.time * 1000).toLocaleString()}</td>
      <td>${esc(e.author)}</td>
      <td>${esc(e.message)}</td>
      <td><button class="btn" data-cfg-diff="${esc(e.id)}">diff</button>
        ${i > 0 ? `<button class="btn" data-cfg-rollback="${esc(e.id)}" data-short="${esc(e.short_id)}">rollback</button>` : ''}</td>
    </tr>`).join('')}</tbody></table>`;
  document.querySelectorAll('#cfgLog [data-cfg-diff]').forEach(btn =>
    btn.addEventListener('click', async () => {
      try {
        const d = await api(`api/admin/config/diff?from=${encodeURIComponent(btn.dataset.cfgDiff)}`);
        $('#cfgDiff').innerHTML = d.diff
          ? `<h3>Diff vs ${esc(btn.dataset.cfgDiff.slice(0,10))} (that commit → current tree)</h3>
             <pre style="background:var(--bg2,#161b22);padding:12px;border-radius:6px;overflow:auto;font-size:12px">${esc(d.diff)}</pre>`
          : '<p class="muted">no differences vs that commit</p>';
      } catch (e) { alert(e.message); }
    }));
  document.querySelectorAll('#cfgLog [data-cfg-rollback]').forEach(btn =>
    btn.addEventListener('click', async () => {
      if (!confirm(`Roll the config tree back to ${btn.dataset.short}? (recorded as a new commit, then reloaded)`)) return;
      try {
        const r = await post('api/admin/config/rollback', {rev: btn.dataset.cfgRollback});
        $('#cfgOut').innerHTML = `<div class="banner ok">Rolled back: ${esc(r.summary)}</div>`;
        refreshCfgLog();
      } catch (e) { alert(e.message); }
    }));
}

async function loadAdmin() {
  const el = $('#tab-admin');
  el.innerHTML = '<p class="muted">loading…</p>';
  let d;
  try { d = await api('api/admin/users'); }
  catch (e) { el.innerHTML = `<div class="banner err">${esc(e.message)}</div>`; return; }
  el.innerHTML = `
    <table><thead><tr><th>user</th><th>role</th><th>auth methods</th><th>tokens</th><th></th></tr></thead><tbody>
    ${d.users.map(u => {
      const self = u.name === me.user.name;
      return `<tr>
      <td>${esc(u.name)}${self ? ' <span class="muted">(you)</span>' : ''}</td>
      <td>${self ? esc(u.role) : `<select data-role-user="${esc(u.name)}">
        ${['ro','rw','admin'].map(r => `<option value="${r}" ${r === u.role ? 'selected' : ''}>${r}</option>`).join('')}
      </select>`}</td>
      <td class="muted">${u.has_password ? 'password' : 'token-only'}${u.totp_enabled ? ' + TOTP' : ''}${u.passkeys ? ` + ${u.passkeys} passkey(s)` : ''}</td>
      <td class="num">${u.tokens}</td>
      <td class="rowbtns">${self ? '<span class="muted">use Account page</span>' : `
        <button class="btn" data-pw-user="${esc(u.name)}">reset password</button>
        <button class="btn" data-2fa-user="${esc(u.name)}">reset 2FA</button>
        <button class="btn danger" data-del-user="${esc(u.name)}">delete</button>`}</td>
    </tr>`;}).join('')}
    </tbody></table>
    <h3>Add user</h3>
    <form id="addUserForm" class="toolbar">
      <input type="text" id="nuName" placeholder="username">
      <select id="nuRole"><option value="ro">ro</option><option value="rw" selected>rw</option><option value="admin">admin</option></select>
      <input type="password" id="nuPass" placeholder="password (blank = token-only)">
      <button class="btn" type="submit">Create</button>
      <span id="nuOut"></span>
    </form>`;
  document.querySelectorAll('[data-role-user]').forEach(s => s.addEventListener('change', async () => {
    try { await post(`api/admin/users/${encodeURIComponent(s.dataset.roleUser)}/role`, {role: s.value}); }
    catch (e) { alert(e.message); loadAdmin(); }
  }));
  document.querySelectorAll('[data-pw-user]').forEach(b => b.addEventListener('click', async () => {
    const pw = prompt(`New password for ${b.dataset.pwUser} (min 8 chars):`);
    if (pw === null) return;
    try { await post(`api/admin/users/${encodeURIComponent(b.dataset.pwUser)}/password`, {password: pw}); loadAdmin(); }
    catch (e) { alert(e.message); }
  }));
  document.querySelectorAll('[data-2fa-user]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm(`Clear TOTP and all passkeys for ${b.dataset['2faUser'] ?? b.getAttribute('data-2fa-user')}? They'll sign in with password only.`)) return;
    const name = b.getAttribute('data-2fa-user');
    try { await post(`api/admin/users/${encodeURIComponent(name)}/reset-2fa`); loadAdmin(); }
    catch (e) { alert(e.message); }
  }));
  document.querySelectorAll('[data-del-user]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm(`Delete user ${b.dataset.delUser}? Their tokens and sessions are revoked.`)) return;
    try { await api('api/admin/users/' + encodeURIComponent(b.dataset.delUser), {method: 'DELETE'}); loadAdmin(); }
    catch (e) { alert(e.message); }
  }));
  $('#addUserForm').addEventListener('submit', async e => {
    e.preventDefault();
    const out = $('#nuOut'); out.textContent = '';
    const pw = $('#nuPass').value;
    try {
      await post('api/admin/users', {name: $('#nuName').value.trim(), role: $('#nuRole').value,
                                      password: pw ? pw : null});
      loadAdmin();
    } catch (err) { out.textContent = err.message; }
  });
}

async function init() {
  try { me = await api('api/me'); } catch { me = { auth_enabled: false, user: null }; }
  if (me.auth_enabled && !me.user) { showLogin(); return; }
  if (me.user) {
    $('#navAccount').hidden = false;
    if (me.user.role === 'admin') $('#navAdmin').hidden = false;
  }
  $('#navUpload').hidden = !canMutate();
  renderUserChip();
  startEvents();
  refreshSummary();
  route();
}
init();
</script>
</body>
