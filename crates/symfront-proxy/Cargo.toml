[package]
name = "symfront-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Caching symbol-server proxy: classification, upstream fan-out, negative caching"

[dependencies]
futures-util.workspace = true
httpdate.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "fs", "macros"] }
toml.workspace = true
tracing.workspace = true

# aws-lc-sys (rustls' crypto provider) assembles its x86_64 code with NASM.
# With this feature it falls back to the prebuilt objects shipped in the
# crate when `nasm` is not on PATH, so a Windows build needs only MSVC and
# CMake. It changes nothing when NASM is installed.
[target.'cfg(windows)'.dependencies]
aws-lc-rs = { workspace = true, features = ["prebuilt-nasm"] }

[dev-dependencies]
axum.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
