[workspace]
members = ["crates/symfront-ident", "crates/symfront-store", "crates/symfront-proxy", "crates/symfront"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# One place to bump versions. Feature sets here are the *minimal* base each
# user of the dep needs; members add crate-specific features additively via
# `features = [...]` next to `workspace = true`.
[workspace.dependencies]
symfront-ident = { path = "crates/symfront-ident" }
symfront-store = { path = "crates/symfront-store" }
symfront-proxy = { path = "crates/symfront-proxy" }

anyhow = "1"
argon2 = "0.6"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"] }
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
# Pin flate2 to the zlib-rs backend (order-of-magnitude faster than stock
# zlib); async-compression picks it up through feature unification.
flate2 = { version = "1", features = ["zlib-rs"] }
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false }
git2 = { version = "0.21", default-features = false }
hmac = "0.13"
httpdate = "1"
notify = "8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = { version = "0.4", features = ["std"] }
rayon = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
cab = "0.6"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webauthn-rs = "0.5"

[profile.release]
lto = "thin"
